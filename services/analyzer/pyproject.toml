[project]
name = "realsignal-analyzer"
version = "0.1.0"
description = "Private analysis service: transcribe, split, judge (Jev), score (Python), write (OpenAI). Never touches the database."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openai>=1.82",
  "python-dotenv>=1.0",
  "certifi",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.22",
  "datamodel-code-generator>=0.26",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

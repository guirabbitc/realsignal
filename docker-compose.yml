# Local Postgres for development. Production uses the Railway Postgres service.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: validate
      POSTGRES_PASSWORD: validate
      POSTGRES_DB: validate_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

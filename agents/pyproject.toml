[project]
name = "validate-agents"
version = "0.1.0"
description = "Fetch.ai uAgents that expose the validate.ai analysis in ASI:One. They call the analyzer pipeline; they hold no analysis logic."
requires-python = ">=3.12,<3.13"
dependencies = [
  "uagents==0.26.0",
  "uagents-core==0.4.11",
  "python-dotenv>=1.0",
  "certifi",
  "validate-analyzer",
]

[tool.uv]
package = false

[tool.uv.sources]
validate-analyzer = { path = "../services/analyzer", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
